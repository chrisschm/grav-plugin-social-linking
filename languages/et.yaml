  TIMEOUT_HELP: Kui kaua tuleb oodata teenuse API vastust, enne kui päring 
    katkestatakse ja kasutatakse olemasolevaid puhverdatud andmeid, kui need 
    juhtumisi on olemas.
  TOKENS_HINT: |
    Enamus avalikke postitusi ei vaja tunnusloa lisamist. Mitteavaliku sisu puhul või
    sagedasemate päringute lubamiseks võid seadistada serverikohase tunnusloa failis
    `user/config/plugins/social-linking.yaml`:

    ```yaml
    tokens:
      norden.social: 'sinu-tunnusluba'
    ```
  ALLOWED_PRIVATE_HOSTS_HINT: |
    Turvalisuse tagamiseks (SSRF-kaitse) keeldub see lisamoodul vaikimisi päringutest
    privaatses/kohalikus/sisevõrgus asuvatele aadressidele (nt 127.0.0.1,
    10.0.0.0/8, 169.254.169.254, ::1), seda nii API-päringute kui allalaaditava meediumi jaoks.
    Kui soovid teadlikult kasutada sisevõrgus olevat Mastodoni serverit, võid selle
    selgesõnaliselt lubatud nimekirja lisada otse failis `user/config/plugins/social-linking.yaml`:

    ```yaml
    allowed_private_hosts:
      - 'mastodon.internal.example'
    ```

    **Hoiatus:** kõik siin loetletud hostid muutuvad serverist kättesaadavaks, isegi kui need asuvad
    sisevõrgus, seega lisa ainult neid hoste, mida usaldad.
