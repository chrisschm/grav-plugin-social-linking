name: Social Linking
slug: social-linking
type: plugin
version: 0.2.0
description: Bindet Beiträge (und später Profile/Timelines) von Mastodon und kompatiblen Diensten als lokal zwischengespeicherte, themefähige Links/Embeds ein.
icon: retweet
dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: shortcode-core, version: '>=5.0.0' }
author:
    name: Christian Schmidt
    email: chschmidt@noreply.codeberg.org
    url: https://www.jcs-net.de
keywords: grav, plugin, mastodon, activitypub, fediverse, social, embed, shortcode
homepage: https://codeberg.org/chschmidt/grav-plugin-social-linking
bugs: https://codeberg.org/chschmidt/grav-plugin-social-linking/issues
docs: https://codeberg.org/chschmidt/grav-plugin-social-linking/wiki
license: MIT
compatibility:
  grav:
    - '1.7'
    - '2.0'
form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    storage_subfolder:
      type: text
      label: Speicherordner
      help: Name des Unterordners, der innerhalb jedes Seitenordners für Rohdaten und lokale Medienkopien angelegt wird.
      default: _social-linking

    timeout:
      type: text
      label: API-Timeout (Sekunden)
      help: Wie lange auf eine Antwort der Dienst-API gewartet wird, bevor der Aufruf abgebrochen und stattdessen ein evtl. vorhandener Cache-Stand angezeigt wird.
      default: 10
      validate:
        type: int

    tokens_hint:
      type: display
      markdown: true
      content: |
        Für die meisten öffentlichen Beiträge ist kein Zugriffstoken nötig. Für nicht-öffentliche
        Inhalte oder höhere Rate-Limits können pro Instanz Access-Token direkt in
        `user/config/plugins/social-linking.yaml` hinterlegt werden:

        ```yaml
        tokens:
          norden.social: 'dein-access-token'
        ```
