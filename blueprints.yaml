name: Social Linking
slug: social-linking
type: plugin
version: 0.5.3
description: Bindet Beiträge (und später Profile/Timelines) von Mastodon und kompatiblen Diensten als lokal zwischengespeicherte, themefähige Links/Embeds ein.
icon: retweet
dependencies:
  - { name: grav, version: '>=1.7.0' }
  - { name: shortcode-core, version: '>=5.0.0' }
author:
    name: Christian Schmidt
    email: chschmidt@noreply.codeberg.org
    url: https://www.jcs-net.de
keywords: grav, plugin, mastodon, activitypub, fediverse, social, embed, shortcode
homepage: https://codeberg.org/chschmidt/grav-plugin-social-linking
bugs: https://codeberg.org/chschmidt/grav-plugin-social-linking/issues
docs: https://codeberg.org/chschmidt/grav-plugin-social-linking/wiki
license: MIT
compatibility:
  grav:
    - '1.7'
    - '2.0'
form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 0
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool

    storage_subfolder:
      type: text
      label: PLUGIN_SOCIAL_LINKING.STORAGE_SUBFOLDER
      help: PLUGIN_SOCIAL_LINKING.STORAGE_SUBFOLDER_HELP
      default: _social-linking

    timeout:
      type: text
      label: PLUGIN_SOCIAL_LINKING.TIMEOUT
      help: PLUGIN_SOCIAL_LINKING.TIMEOUT_HELP
      default: 10
      validate:
        type: int

    tokens_hint:
      type: display
      markdown: true
      content: PLUGIN_SOCIAL_LINKING.TOKENS_HINT

    allowed_private_hosts_hint:
      type: display
      markdown: true
      content: PLUGIN_SOCIAL_LINKING.ALLOWED_PRIVATE_HOSTS_HINT
