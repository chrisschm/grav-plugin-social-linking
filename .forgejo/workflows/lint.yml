name: Syntax-Checks

on:
  push:
  pull_request:

jobs:
  syntax-php:
    if: github.server_url != 'https://github.com'
    runs-on: codeberg-tiny
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geänderte Dateien ermitteln
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          git diff --name-only --diff-filter=d "$BASE" HEAD > changed.txt || true
          cat changed.txt

      - name: PHP-Syntax prüfen
        run: grep -E '\.php$' changed.txt | xargs -r -n1 php -l

  syntax-twig:
    if: github.server_url != 'https://github.com'
    runs-on: codeberg-small
    container: composer:2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Geänderte Dateien ermitteln
        run: |
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE=$(git rev-list --max-parents=0 HEAD)
          fi
          git diff --name-only --diff-filter=d "$BASE" HEAD > changed.txt || true
          cat changed.txt

      - name: Twig-Syntax prüfen
        run: |
          mkdir -p /tmp/twig-lint
          composer require --working-dir=/tmp/twig-lint twig/twig --no-interaction --quiet
          grep -E '\.twig$' changed.txt | while read -r f; do
            [ -f "$f" ] || continue
            php -r '
              require "/tmp/twig-lint/vendor/autoload.php";
              $file = $argv[1];
              $loader = new \Twig\Loader\ArrayLoader([]);
              $twig = new \Twig\Environment($loader);
              try {
                  $twig->parse($twig->tokenize(new \Twig\Source(file_get_contents($file), $file)));
                  echo "$file: OK\n";
              } catch (\Twig\Error\SyntaxError $e) {
                  fwrite(STDERR, "$file: " . $e->getMessage() . "\n");
                  exit(1);
              }
            ' "$f"
          done
