name: Bug Report
about: Report a problem with the social-linking plugin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in as much detail as possible — the project
        currently has no automated test suite, so a good report is the fastest way to a fix.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: See Admin panel, blueprints.yaml, or CHANGELOG.md
      placeholder: e.g. 0.5.1
    validations:
      required: true
  - type: input
    id: grav-version
    attributes:
      label: Grav version
      placeholder: e.g. 1.7.45
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      description: Plugin requires PHP >= 7.4
      placeholder: e.g. 8.2
    validations:
      required: true
  - type: dropdown
    id: integration
    attributes:
      label: How is the plugin used on the affected page?
      options:
        - "Twig function: {{ social_embed({url: '....'}) }}"
        - "Shortcode: [social-embed ...]"
        - Both / not sure
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: type affected
      options:
        - status
        - profile
        - timeline
        - Not sure / more then one
  - type: textarea
    id: call
    attributes:
      label: Shortcode / Twig call used
      description: >-
        Paste the exact [social-embed ...] shortcode or social_embed({...}) Twig call from the
        page where the bug occurs (url, service, type, limit, refresh, delete — whichever apply).
      placeholder: '[social-embed url="https://norden.social/@user/113456789012345678" type="status"]'
      render: text
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do, what did you expect to happen, what happened instead?
      placeholder: |
        1. Configure type X with option Y
        2. Load the page
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / error messages
      description: >-
        Grav log output, PHP errors, or browser console output. Please redact any private
        URLs or credentials before pasting.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked existing issues for a duplicate before opening this one
          required: true
